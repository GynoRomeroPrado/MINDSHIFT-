apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindshift-frontend
  namespace: mindshift
  labels:
    app: mindshift
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindshift
      component: frontend
  template:
    metadata:
      labels:
        app: mindshift
        component: frontend
    spec:
      containers:
      - name: frontend
        image: mindshift/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "https://api.mindshift.ai"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mindshift-frontend
  namespace: mindshift
  labels:
    app: mindshift
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: mindshift
    component: frontend
