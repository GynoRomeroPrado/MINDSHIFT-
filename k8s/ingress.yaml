apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindshift-ingress
  namespace: mindshift
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.mindshift.ai
    - api.mindshift.ai
    secretName: mindshift-tls
  rules:
  - host: app.mindshift.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mindshift-frontend
            port:
              number: 80
  - host: api.mindshift.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mindshift-backend
            port:
              number: 8000
---
apiVersion: v1
kind: Namespace
metadata:
  name: mindshift
  labels:
    name: mindshift
---
apiVersion: v1
kind: Secret
metadata:
  name: mindshift-secrets
  namespace: mindshift
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/mindshift"
  redis-url: "redis://redis:6379"
  openai-api-key: "REPLACE_WITH_REAL_KEY"
  anthropic-api-key: "REPLACE_WITH_REAL_KEY"
  jwt-secret: "REPLACE_WITH_REAL_SECRET"
  encryption-key: "REPLACE_WITH_REAL_KEY"
  sentry-dsn: ""
